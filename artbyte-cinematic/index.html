<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtByte – Cinematic Commercial</title>
    <link rel="icon" href="./assets/branding/artbyte-logo.webp" />
  </head>
  <body>
    <div id="stage">
      <div id="frame">
        <canvas id="viewport"></canvas>
        <div id="overlay-layer" aria-live="polite"></div>
        <div id="safe-guides" hidden></div>
      </div>
    </div>
    <div id="loader">
      <div class="loader-inner">
        <img src="./assets/branding/artbyte-logo.webp" alt="ArtByte" />
        <div class="loader-bar"><span></span></div>
        <p class="loader-text">جارٍ تجهيز المشهد…</p>
      </div>
    </div>
    <div id="start-gate" hidden>
      <button type="button" id="start-btn">▶ تشغيل الإعلان</button>
    </div>
    <div id="dev-ui" dir="ltr"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
